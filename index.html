<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinimalCAD Web</title>
  </head>
  <body>
    <div id="app">
      <div id="toolbar"></div>
      <div id="canvas-wrapper">
        <canvas id="cad-canvas" tabindex="0"></canvas>
        <button id="home-btn" title="Home view (fit drawing)">⌂</button>
        <!-- Touch-only overlay (shown via CSS, see style.css) -- phones/tablets
             have no physical Escape key. Wired in main.ts. -->
        <div id="mobile-controls">
          <button id="mobile-undo" title="Undo">↶</button>
          <button id="mobile-redo" title="Redo">↷</button>
          <button id="mobile-escape" title="Cancel (Esc)">✕</button>
          <button id="mobile-enter" title="Confirm (Enter)">✓</button>
        </div>
      </div>
      <div id="command-bar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
